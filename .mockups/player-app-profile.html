<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1C24; --surface:#242430; --surface2:#2C2C3B; --text:#F2F0EB; --muted:#9B99AE;
    --line:#35354A; --orange:#FF6B2B;
  }
  *{box-sizing:border-box}
  body{margin:0;width:390px;height:844px;zoom:.89;background:var(--bg);font-family:'Instrument Sans',sans-serif;color:var(--text);overflow:hidden;position:relative}
  .topbar{padding:20px 20px 4px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px}
  .content{padding:10px 20px}
  .avatar{width:68px;height:68px;border-radius:999px;background:linear-gradient(135deg,var(--orange),#FF9445);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;margin:4px auto 10px}
  .name{text-align:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px}
  .phone{text-align:center;font-size:12px;color:var(--muted);margin-top:2px;margin-bottom:18px}
  .field{margin-bottom:12px}
  .flabel{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .finput{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:13px}
  .rate{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:16px 0 14px}
  .star{color:#FBBF24;font-size:18px}
  .ratelabel{flex:1;font-weight:700;font-size:13.5px}
  .chev{color:var(--muted);font-size:14px}
  .row2{display:flex;gap:10px}
  .row2 .field{flex:1}
  .save{background:var(--orange);color:#fff;border-radius:13px;padding:14px;text-align:center;font-weight:700;font-size:14px;margin-top:8px}
  .navbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding-bottom:8px}
  .nav{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600}
  .nav.active{color:var(--orange)}
</style>
</head>
<body>
  <div class="topbar">Profile</div>
  <div class="content">
    <div class="avatar">AM</div>
    <div class="name">Arjun Mehta</div>
    <div class="phone">+91 98xxx xx212</div>

    <div class="field"><div class="flabel">Phone</div><div class="finput">+91 98xxx xx212</div></div>
    <div class="field"><div class="flabel">Age</div><div class="finput">17 yrs</div></div>

    <div class="rate"><span class="star">&#9733;</span><span class="ratelabel">Rate TT Arena</span><span class="chev">&rsaquo;</span></div>

    <div class="row2">
      <div class="field"><div class="flabel">Academy / Club</div><div class="finput">Capital TT Academy</div></div>
      <div class="field"><div class="flabel">City</div><div class="finput">New Delhi</div></div>
    </div>
    <div class="save">Save Profile</div>
  </div>
  <div class="navbar">
    <div class="nav">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Home
    </div>
    <div class="nav">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10l-1 9a4 4 0 0 1-8 0L7 4z"/><path d="M5 4H3v2a4 4 0 0 0 4 4M19 4h2v2a4 4 0 0 1-4 4"/></svg>
      Draw
    </div>
    <div class="nav">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Schedule
    </div>
    <div class="nav active">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      Profile
    </div>
  </div>
</body>
</html>
