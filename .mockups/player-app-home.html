<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F4F9; --surface:#FFFFFF; --surface2:#EDEBF4; --text:#1C1C24; --muted:#69667A;
    --line:#E2DFEC; --teal:#00998A; --orange:#FF6B2B;
  }
  *{box-sizing:border-box}
  body{margin:0;width:390px;height:844px;background:var(--bg);font-family:'Instrument Sans',sans-serif;color:var(--text);overflow:hidden;position:relative}
  .topbar{display:flex;align-items:center;gap:10px;padding:18px 20px 10px}
  .mark{width:30px;height:30px;border-radius:8px;background:var(--orange);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:13px}
  .title{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px}
  .content{padding:14px 20px}
  .mini{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:14px 0 8px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .card .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .card .tname{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:15.5px}
  .badge{font-size:10px;font-weight:800;padding:4px 10px;border-radius:999px;text-transform:uppercase}
  .badge.live{background:var(--orange);color:#fff}
  .badge.soon{background:var(--surface2);color:var(--muted)}
  .card .meta{color:var(--muted);font-size:12px}
  .navbar{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around}
  .nav{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);font-weight:600}
  .nav.active{color:var(--orange)}
  .dot{width:22px;height:22px;border-radius:7px;background:var(--surface2)}
  .nav.active .dot{background:var(--orange)}
</style>
</head>
<body>
  <div class="topbar"><div class="mark">TT</div><div class="title">Home</div></div>
  <div class="content">
    <div class="mini">Your tournaments</div>
    <div class="card">
      <div class="row1"><div class="tname">Sample Open 2026</div><span class="badge live">Live</span></div>
      <div class="meta">New Delhi &middot; Men's Singles &middot; Round of 8</div>
    </div>
    <div class="card">
      <div class="row1"><div class="tname">Riverside Junior Cup</div><span class="badge soon">Upcoming</span></div>
      <div class="meta">Pune &middot; 2&ndash;3 Dec 2026</div>
    </div>
    <div class="card">
      <div class="row1"><div class="tname">Delhi Summer Classic</div></div>
      <div class="meta">Completed &middot; Runner-up, Men's Singles</div>
    </div>
  </div>
  <div class="navbar">
    <div class="nav active"><div class="dot"></div>Home</div>
    <div class="nav"><div class="dot"></div>Draw</div>
    <div class="nav"><div class="dot"></div>Schedule</div>
    <div class="nav"><div class="dot"></div>Chat</div>
    <div class="nav"><div class="dot"></div>Profile</div>
  </div>
</body>
</html>
