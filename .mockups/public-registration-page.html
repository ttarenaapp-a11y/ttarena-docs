<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#F3F4EF; --ground-raised:#FFFFFF; --ink:#15201B; --ink-soft:#4B5750;
    --line:#DADFD5; --court:#1F5C4D; --court-soft:#E7F0EC; --accent:#FF6B2B;
  }
  *{box-sizing:border-box}
  body{margin:0;width:1280px;height:800px;background:var(--ground);font-family:'IBM Plex Sans',sans-serif;color:var(--ink);overflow:hidden;display:flex;justify-content:center}
  h1,h2,h3{font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.01em;margin:0}
  .page{width:640px;padding-top:40px}
  .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px}
  .brand .mark{width:30px;height:30px;border-radius:8px;background:var(--court);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Archivo',sans-serif;font-weight:800;font-size:13px}
  .brand .name{font-family:'Archivo',sans-serif;font-weight:800;font-size:17px}
  .hero{background:var(--court);color:#fff;border-radius:18px;padding:26px 30px;margin-bottom:22px}
  .hero .t{font-size:21px;margin-bottom:4px}
  .hero .s{font-size:13px;opacity:.85}
  .card{background:var(--ground-raised);border:1px solid var(--line);border-radius:18px;padding:28px}
  .row{display:flex;gap:12px;margin-bottom:14px}
  .field{flex:1}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
  .input{border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px;background:var(--ground)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px;text-align:center;font-weight:700;font-size:14px;margin-top:8px}
</style>
</head>
<body>
  <div class="page">
    <div class="brand"><div class="mark">TT</div><div class="name">TT Arena</div></div>
    <div class="hero">
      <div class="t">Register &mdash; Sample Open 2026</div>
      <div class="s">New Delhi &middot; 14&ndash;16 Nov 2026 &middot; Registration closes 10 Nov</div>
    </div>
    <div class="card">
      <div class="row">
        <div class="field"><label>Full name</label><div class="input">Priya Nair</div></div>
        <div class="field"><label>Date of birth</label><div class="input">04 Jun 2008</div></div>
      </div>
      <div class="row">
        <div class="field"><label>Gender</label><div class="input">Female</div></div>
        <div class="field"><label>Category</label><div class="input">Women's Singles</div></div>
      </div>
      <div class="row">
        <div class="field"><label>City</label><div class="input">New Delhi</div></div>
        <div class="field"><label>District</label><div class="input">South Delhi</div></div>
      </div>
      <div class="row">
        <div class="field"><label>Academy / Club</label><div class="input">Riverside Club</div></div>
      </div>
      <div class="btn">Submit registration</div>
    </div>
  </div>
</body>
</html>
