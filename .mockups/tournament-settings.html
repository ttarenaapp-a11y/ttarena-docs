<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#F3F4EF; --ground-raised:#FFFFFF; --ink:#15201B; --ink-soft:#4B5750;
    --line:#DADFD5; --court:#1F5C4D; --court-soft:#E7F0EC; --accent:#FF6B2B; --accent-soft:#FFE7D9;
  }
  *{box-sizing:border-box}
  body{margin:0;width:1280px;height:800px;background:var(--ground);font-family:'IBM Plex Sans',sans-serif;color:var(--ink);overflow:hidden}
  h1,h2,h3{font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.01em;margin:0}
  .topbar{height:64px;background:var(--ground-raised);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:14px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mark{width:30px;height:30px;border-radius:8px;background:var(--court);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Archivo',sans-serif;font-weight:800;font-size:13px}
  .brand .name{font-family:'Archivo',sans-serif;font-weight:800;font-size:17px}
  .tsep{color:var(--ink-soft);margin:0 2px}
  .tname{font-weight:700;font-size:14px}
  .wrap{display:flex}
  .tabs{width:200px;padding:28px 14px;border-right:1px solid var(--line)}
  .tabs .t{padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
  .tabs .t.active{background:var(--court-soft);color:var(--court)}
  .content{flex:1;padding:32px 40px;max-width:760px}
  .content h1{font-size:22px;margin-bottom:24px}
  .section{margin-bottom:28px}
  .section h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:12px}
  .row{display:flex;gap:12px}
  .field{flex:1;margin-bottom:0}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
  .input{border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px;background:var(--ground-raised)}
  .imgbox{width:220px;height:110px;border:1.5px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12px;background:var(--ground-raised)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--court-soft);color:var(--court)}
  .chip.add{background:var(--ground-raised);border:1px dashed var(--line);color:var(--ink-soft)}
  .tables{display:flex;gap:8px;flex-wrap:wrap}
  .table{width:40px;height:40px;border-radius:10px;background:var(--ground-raised);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ink)}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><div class="mark">TT</div><div class="name">TT Arena</div></div>
    <span class="tsep">/</span><span class="tname">Sample Open 2026</span>
  </div>
  <div class="wrap">
    <div class="tabs">
      <div class="t active">Settings</div>
      <div class="t">Registrations</div>
      <div class="t">Referees</div>
      <div class="t">Draws</div>
    </div>
    <div class="content">
      <h1>Settings</h1>

      <div class="section">
        <h3>Tournament dates</h3>
        <div class="row">
          <div class="field"><label>Start date</label><div class="input">14 Nov 2026</div></div>
          <div class="field"><label>End date</label><div class="input">16 Nov 2026</div></div>
        </div>
      </div>

      <div class="section">
        <h3>Tournament image</h3>
        <div class="imgbox">Upload image</div>
      </div>

      <div class="section">
        <h3>Categories</h3>
        <div class="chips">
          <div class="chip">Men's Singles</div>
          <div class="chip">Women's Singles</div>
          <div class="chip">Doubles</div>
          <div class="chip add">+ Add category</div>
        </div>
      </div>

      <div class="section">
        <h3>Tables</h3>
        <div class="tables">
          <div class="table">1</div><div class="table">2</div><div class="table">3</div>
          <div class="table">4</div><div class="table">5</div><div class="table">6</div>
        </div>
      </div>

      <div class="section">
        <h3>Registration</h3>
        <div class="row">
          <div class="field"><label>Registration deadline</label><div class="input">10 Nov 2026</div></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
