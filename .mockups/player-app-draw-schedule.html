<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F4F9; --surface:#FFFFFF; --surface2:#EDEBF4; --text:#1C1C24; --muted:#69667A;
    --line:#E2DFEC; --teal:#00998A; --teal-soft:#E0F3F0; --orange:#FF6B2B;
  }
  *{box-sizing:border-box}
  body{margin:0;width:390px;height:844px;background:var(--bg);font-family:'Instrument Sans',sans-serif;color:var(--text);overflow:hidden;position:relative}
  .mono{font-family:'Space Mono',monospace}
  .topbar{padding:18px 20px 6px}
  .ttitle{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px}
  .tsub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .segment{display:flex;background:var(--surface2);border-radius:12px;padding:4px;margin:14px 20px}
  .seg{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .seg.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .content{padding:4px 20px}
  .wincard{background:var(--teal-soft);border:1.5px solid var(--teal);border-radius:20px;padding:16px;margin-bottom:12px}
  .wrow1{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .wtag{font-size:10.5px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.04em}
  .wbadge{background:var(--teal);color:#fff;font-size:10px;font-weight:800;padding:4px 10px;border-radius:999px;text-transform:uppercase}
  .pvs{display:flex;justify-content:space-between;align-items:center}
  .pname{font-weight:800;font-size:15px}
  .pname.muted{color:var(--muted);font-weight:500}
  .pscore{font-weight:800;font-size:17px}
  .pscore.muted{color:var(--muted);font-weight:600}
  .wfoot{font-size:11px;color:var(--muted);margin-top:10px}
  .upcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px}
  .uptag{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
  .upvs{display:flex;justify-content:space-between}
  .upname{font-weight:700;font-size:14.5px}
  .upmeta{font-size:11px;color:var(--muted);margin-top:8px}
  .navbar{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around}
  .nav{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);font-weight:600}
  .nav.active{color:var(--orange)}
  .dot{width:22px;height:22px;border-radius:7px;background:var(--surface2)}
  .nav.active .dot{background:var(--orange)}
</style>
</head>
<body>
  <div class="topbar">
    <div class="ttitle">Sample Open 2026</div>
    <div class="tsub">Men's Singles &middot; Your schedule</div>
  </div>
  <div class="segment">
    <div class="seg active">Your Schedule</div>
    <div class="seg">Tournament Schedule</div>
  </div>
  <div class="content">
    <div class="wincard">
      <div class="wrow1"><span class="wtag">Round of 16 &middot; Just now</span><span class="wbadge">Won</span></div>
      <div class="pvs"><span class="pname">You</span><span class="pscore mono">3</span></div>
      <div class="pvs"><span class="pname muted">Varun Kapoor</span><span class="pscore mono muted">1</span></div>
      <div class="wfoot">You're through to the Quarter-final &rarr;</div>
    </div>
    <div class="upcard">
      <div class="uptag">Quarter-final &middot; Tomorrow, 4:30 PM</div>
      <div class="upvs"><span class="upname">You</span><span class="upname">Rohan Verma</span></div>
      <div class="upmeta">Table 2 &middot; Referee assigned</div>
    </div>
  </div>
  <div class="navbar">
    <div class="nav"><div class="dot"></div>Home</div>
    <div class="nav"><div class="dot"></div>Draw</div>
    <div class="nav active"><div class="dot"></div>Schedule</div>
    <div class="nav"><div class="dot"></div>Chat</div>
    <div class="nav"><div class="dot"></div>Profile</div>
  </div>
</body>
</html>
