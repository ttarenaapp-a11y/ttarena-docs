<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1C24; --surface:#242430; --surface2:#2C2C3B; --text:#F2F0EB; --muted:#9B99AE;
    --line:#35354A; --teal:#00C2A8; --teal-soft:#16332F; --orange:#FF6B2B;
  }
  *{box-sizing:border-box}
  body{margin:0;width:390px;height:844px;zoom:.89;background:var(--bg);font-family:'Instrument Sans',sans-serif;color:var(--text);overflow:hidden;position:relative}
  .mono{font-family:'Space Mono',monospace}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 2px}
  .ttitle{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px}
  .tsub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .icons{display:flex;gap:14px;align-items:center;color:var(--muted)}
  .segment{display:flex;background:var(--surface2);border-radius:12px;padding:4px;margin:16px 20px 14px}
  .seg{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .seg.active{background:var(--surface);color:var(--text)}
  .content{padding:4px 20px}
  .wincard{background:var(--teal-soft);border:1.5px solid var(--teal);border-radius:20px;padding:16px;margin-bottom:12px}
  .wrow1{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .wtag{font-size:10.5px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.04em}
  .wbadge{background:var(--teal);color:#0d1f1c;font-size:10px;font-weight:800;padding:4px 10px;border-radius:999px;text-transform:uppercase}
  .pvs{display:flex;justify-content:space-between;align-items:center}
  .pname{font-weight:800;font-size:15px;color:var(--text)}
  .pname.muted{color:var(--muted);font-weight:500}
  .pscore{font-weight:800;font-size:17px;color:var(--text)}
  .pscore.muted{color:var(--muted);font-weight:600}
  .wfoot{font-size:11px;color:var(--muted);margin-top:10px}
  .upcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px}
  .uptag{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
  .upvs{display:flex;justify-content:space-between}
  .upname{font-weight:700;font-size:14.5px}
  .upmeta{font-size:11px;color:var(--muted);margin-top:8px}
  .navbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding-bottom:8px}
  .nav{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600}
  .nav.active{color:var(--orange)}
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <div class="ttitle">Sample Open 2026</div>
      <div class="tsub">Men's Singles &middot; Your schedule</div>
    </div>
    <div class="icons">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </div>
  </div>
  <div class="segment">
    <div class="seg active">Your Schedule</div>
    <div class="seg">Tournament Schedule</div>
  </div>
  <div class="content">
    <div class="wincard">
      <div class="wrow1"><span class="wtag">Round of 16 &middot; Just now</span><span class="wbadge">Won</span></div>
      <div class="pvs"><span class="pname">You</span><span class="pscore mono">3</span></div>
      <div class="pvs"><span class="pname muted">Varun Kapoor</span><span class="pscore mono muted">1</span></div>
      <div class="wfoot">You're through to the Quarter-final &rarr;</div>
    </div>
    <div class="upcard">
      <div class="uptag">Quarter-final &middot; Tomorrow, 4:30 PM</div>
      <div class="upvs"><span class="upname">You</span><span class="upname">Rohan Verma</span></div>
      <div class="upmeta">Table 2 &middot; Referee assigned</div>
    </div>
  </div>
  <div class="navbar">
    <div class="nav">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Home
    </div>
    <div class="nav">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10l-1 9a4 4 0 0 1-8 0L7 4z"/><path d="M5 4H3v2a4 4 0 0 0 4 4M19 4h2v2a4 4 0 0 1-4 4"/></svg>
      Draw
    </div>
    <div class="nav active">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/></svg>
      Schedule
    </div>
    <div class="nav">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      Profile
    </div>
  </div>
</body>
</html>
