<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F4F9; --surface:#FFFFFF; --surface2:#EDEBF4; --text:#1C1C24; --muted:#69667A;
    --line:#E2DFEC; --orange:#FF6B2B;
  }
  *{box-sizing:border-box}
  body{margin:0;width:390px;height:844px;background:var(--bg);font-family:'Instrument Sans',sans-serif;color:var(--text);overflow:hidden;display:flex;align-items:center}
  .wrap{padding:0 26px;width:100%}
  .mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--orange),#FF9445);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:900;font-size:24px;margin-bottom:18px}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:900;font-size:27px;margin:0 0 8px}
  .sub{color:var(--muted);font-size:13.5px;line-height:1.5;margin-bottom:30px}
  .label{font-size:13px;font-weight:700;margin-bottom:8px}
  .otp{display:flex;gap:9px;margin-bottom:16px}
  .box{width:46px;height:56px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-weight:700;font-size:20px}
  .box.filled{border-color:var(--orange);color:var(--orange)}
  .box.empty{color:var(--line)}
  .hint{color:var(--muted);font-size:12px;margin-bottom:22px}
  .btn{background:var(--orange);color:#fff;border-radius:14px;padding:16px;text-align:center;font-weight:700;font-size:14.5px}
  .change{text-align:center;color:var(--muted);font-size:12.5px;margin-top:14px;font-weight:600}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">TT</div>
    <h1>TT Arena</h1>
    <div class="sub">Check draws, live standings, schedules, and chat with players.</div>
    <div class="label">6-digit OTP sent to +91 98xxx xx212</div>
    <div class="otp">
      <div class="box filled">4</div>
      <div class="box filled">1</div>
      <div class="box filled">2</div>
      <div class="box filled">7</div>
      <div class="box empty">&middot;</div>
      <div class="box empty">&middot;</div>
    </div>
    <div class="hint">Auto-filled from your SMS &mdash; no need to switch apps.</div>
    <div class="btn">Verify &amp; Enter</div>
    <div class="change">Change number</div>
  </div>
</body>
</html>
